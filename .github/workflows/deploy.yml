name: Deploy

# Merging to main deploys dev. To deploy another environment, use
# Actions > Deploy > Run workflow and pick dev, test or prod.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to deploy
        type: choice
        options: [dev, test, prod]
        default: dev

# One deploy per environment at a time; a newer run waits instead of cancelling.
concurrency:
  group: deploy-${{ inputs.environment || 'dev' }}
  cancel-in-progress: false

permissions:
  id-token: write # lets the job request an OIDC token for AWS
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    # The GitHub environment (dev, test or prod) holds that environment's
    # variables and its approval rule (Settings > Environments).
    environment: ${{ inputs.environment || 'dev' }}
    env:
      DEPLOY_ENV: ${{ inputs.environment || 'dev' }}
      # Public values (not secrets), set as environment variables in GitHub.
      VITE_API_URL: ${{ vars.VITE_API_URL }}
      VITE_COGNITO_USER_POOL_ID: ${{ vars.VITE_COGNITO_USER_POOL_ID }}
      VITE_COGNITO_CLIENT_ID: ${{ vars.VITE_COGNITO_CLIENT_ID }}
      VITE_COGNITO_REGION: ${{ vars.VITE_COGNITO_REGION }}
      VITE_COGNITO_DOMAIN: ${{ vars.VITE_COGNITO_DOMAIN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: infra/requirements.txt

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: Check required variables
        # An empty value would build a front end that cannot sign in, and deploy it.
        run: |
          for v in VITE_API_URL VITE_COGNITO_USER_POOL_ID VITE_COGNITO_CLIENT_ID VITE_COGNITO_REGION VITE_COGNITO_DOMAIN; do
            if [ -z "${!v}" ]; then
              echo "::error::Missing GitHub environment variable $v"
              exit 1
            fi
          done

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Deploy
        working-directory: infra
        run: |
          npm install -g aws-cdk
          pip install -r requirements.txt
          # Only this environment's app stack; the GitHub access stack is deployed by hand.
          cdk deploy "SmartvibesSongwriter-$DEPLOY_ENV" -c env="$DEPLOY_ENV" --require-approval never
