name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# One deploy at a time; a newer push waits instead of cancelling a running deploy.
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  id-token: write # lets the job request an OIDC token for AWS
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Required reviewers are configured on this environment in GitHub
    # (Settings > Environments > production), so each deploy waits for approval.
    environment: production
    env:
      # Public values (not secrets), set as environment variables in GitHub.
      VITE_API_URL: ${{ vars.VITE_API_URL }}
      VITE_COGNITO_USER_POOL_ID: ${{ vars.VITE_COGNITO_USER_POOL_ID }}
      VITE_COGNITO_CLIENT_ID: ${{ vars.VITE_COGNITO_CLIENT_ID }}
      VITE_COGNITO_REGION: ${{ vars.VITE_COGNITO_REGION }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: infra/requirements.txt

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: Check required variables
        # An empty value would build a front end that cannot sign in, and deploy it.
        run: |
          for v in VITE_API_URL VITE_COGNITO_USER_POOL_ID VITE_COGNITO_CLIENT_ID VITE_COGNITO_REGION; do
            if [ -z "${!v}" ]; then
              echo "::error::Missing GitHub environment variable $v"
              exit 1
            fi
          done

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Deploy
        working-directory: infra
        run: |
          npm install -g aws-cdk
          pip install -r requirements.txt
          # Only the app stack; the GitHub access stack is deployed by hand.
          cdk deploy SmartvibesSongwriter-dev --require-approval never
